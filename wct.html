<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&display=swap" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            h1,h2,h3 {
                font-family: "Libre Caslon Display", serif;
                font-weight: 400;
                font-style: normal;
                display:flex;
                align-content:center;
                justify-content:center;
                align-items:center;
                letter-spacing:.1em;
                font-size:2.5rem;
                transform: scaleY(.85);
                padding:1em 0;
            }
            h2 {
                font-size:2rem;
            }
            h3 {
                font-size:1.5rem;
            }
            .star {
                font-size:.5em;
                padding:.5em;
            }
        </style>
    </head>
    <body>
        <h1>1944 <span class="star">✦</span> WCT <span class="star">✦</span> 2025</h1>
        <h2>1944 <span class="star">✦</span> WCT <span class="star">✦</span> 2025</h1>
        <h3>1944 <span class="star">✦</span> WCT <span class="star">✦</span> 2025</h1>
    </body>
</html>
